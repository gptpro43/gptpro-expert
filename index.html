<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Export Data - GPT Pro</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#050505',
                        surface: '#0a0a0a',
                        primary: '#f97316', /* Orange */
                        accent: '#fb923c', /* Light Orange */
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    backgroundImage: {
                        'grid-pattern': "linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px)",
                        'card-gradient': "linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%)",
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* BACKGROUNDS (Keeping the one you liked) */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ETHERIS STYLE CARDS */
        .premium-card {
            background: rgba(12, 14, 20, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03), 
                        0 20px 40px -10px rgba(0, 0, 0, 0.8);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.4s ease;
        }

        .premium-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            opacity: 0.5;
        }

        /* Dual Tone Glows - Orange Dominant */
        .glow-orange {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.25) 0%, transparent 70%);
            pointer-events: none;
            filter: blur(60px);
            z-index: 0;
        }
        
        .glow-blue {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
            pointer-events: none;
            filter: blur(50px);
            z-index: 0;
        }

        /* 3D Window Effect */
        .window-3d {
            transform: perspective(1000px) rotateX(2deg) rotateY(0deg);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            background: #151921;
            transition: transform 0.5s ease;
        }
        
        .premium-card:hover .window-3d {
            transform: perspective(1000px) rotateX(0deg) scale(1.02);
        }

        /* Typography */
        .text-gradient-orange {
            background: linear-gradient(135deg, #fff 30%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .text-gradient-blue {
            background: linear-gradient(135deg, #fff 30%, #fb923c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Scroll Reveal */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Mac Header */
        .mac-header {
            background: rgba(255,255,255,0.03);
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        /* Neon Icons */
        .icon-container {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            position: relative;
            z-index: 10;
        }
        .icon-orange {
            background: linear-gradient(145deg, rgba(249,115,22,0.1), rgba(0,0,0,0));
            border: 1px solid rgba(249,115,22,0.3);
            box-shadow: 0 0 20px rgba(249,115,22,0.1);
        }
        .icon-blue {
            background: linear-gradient(145deg, rgba(251,146,60,0.1), rgba(0,0,0,0));
            border: 1px solid rgba(251,146,60,0.3);
            box-shadow: 0 0 20px rgba(251,146,60,0.1);
        }
    </style>
</head>
<body class="text-white min-h-screen selection:bg-primary selection:text-black" 
      x-data="{ 
          lang: localStorage.getItem('gptpro-lang') || (navigator.language.startsWith('fr') ? 'fr' : 'en'),
          modalOpen: false,
          modalImage: '',
          setLang(l) { 
              this.lang = l; 
              localStorage.setItem('gptpro-lang', l); 
          }
      }">

    <!-- Dynamic Canvas Background (Preserved) -->
    <canvas id="canvas-bg"></canvas>
    <div class="fixed inset-0 bg-grid-pattern opacity-20 pointer-events-none z-0"></div>
    <div class="fixed inset-0 pointer-events-none z-0 bg-[radial-gradient(circle_at_center,transparent_0%,#050505_90%)]"></div>
    
    <!-- Ambient Orange Glows -->
    <div class="fixed -top-40 -left-40 w-[600px] h-[600px] bg-orange-500/10 rounded-full blur-[120px] pointer-events-none z-0"></div>
    <div class="fixed top-1/3 -right-40 w-[500px] h-[500px] bg-orange-600/15 rounded-full blur-[100px] pointer-events-none z-0"></div>
    <div class="fixed -bottom-40 left-1/3 w-[400px] h-[400px] bg-blue-500/5 rounded-full blur-[80px] pointer-events-none z-0"></div>

    <!-- Nav -->
    <nav class="fixed top-0 w-full z-40 border-b border-white/5 bg-black/80 backdrop-blur-xl transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="text-xl font-bold tracking-widest font-serif italic relative group cursor-pointer">
                GPT <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-accent font-sans font-extrabold">PRO</span>
            </div>
            <div class="flex gap-1 bg-white/5 p-1 rounded-lg border border-white/5">
                <button @click="setLang('fr')" :class="lang === 'fr' ? 'bg-white/10 text-white shadow-sm' : 'text-gray-500 hover:text-white'" class="px-3 py-1 text-[10px] font-bold rounded-md transition-all">FR</button>
                <button @click="setLang('en')" :class="lang === 'en' ? 'bg-white/10 text-white shadow-sm' : 'text-gray-500 hover:text-white'" class="px-3 py-1 text-[10px] font-bold rounded-md transition-all">EN</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="relative z-10 pt-32 pb-32 px-4 md:px-8 max-w-7xl mx-auto">
        
        <!-- Hero -->
        <div class="text-center mb-24 md:mb-32 reveal active">
            <!-- Badge -->
            <div class="inline-flex items-center gap-2 mb-8 px-4 py-1.5 rounded-full border border-white/10 bg-white/5 backdrop-blur-md text-[10px] font-bold uppercase tracking-[0.2em] shadow-[0_0_30px_rgba(6,182,212,0.15)]">
                <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></span>
                <span x-text="lang === 'fr' ? 'Tutoriel de Migration' : 'Migration Tutorial'" class="text-gray-300"></span>
            </div>
            
            <h1 class="text-5xl md:text-7xl lg:text-8xl font-serif italic mb-8 leading-tight tracking-tight">
                <span x-text="lang === 'fr' ? 'Sécurisez vos' : 'Secure your'"></span><br/>
                <span class="text-gradient-orange not-italic font-sans font-bold inline-block cursor-default drop-shadow-[0_0_35px_rgba(249,115,22,0.3)]">Conversations</span>
            </h1>
            
            <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed font-light"
               x-text="lang === 'fr' ? 'Suivez ces 5 étapes simples pour exporter l\'intégralité de votre historique ChatGPT avant la migration.' : 'Follow these 5 simple steps to export your entire ChatGPT history before migrating.'">
            </p>
        </div>

        <!-- Steps Container -->
        <div class="flex flex-col gap-16 md:gap-24">

            <!-- Step 1: Tampermonkey (Card Style) -->
            <div class="premium-card p-8 md:p-12 reveal group">
                <!-- Glows -->
                <div class="glow-orange -right-20 -bottom-20"></div>
                <div class="glow-blue -left-20 -top-20"></div>

                <div class="relative z-10 flex flex-col md:flex-row items-center gap-12">
                    <div class="w-full md:w-1/3">
                        <div class="flex items-center gap-4 mb-6">
                            <div class="icon-container icon-orange">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14.25 6.087c0-.355.186-.676.401-.959.221-.29.349-.634.349-1.003 0-1.036-1.007-1.875-2.25-1.875s-2.25.84-2.25 1.875c0 .369.128.713.349 1.003.215.283.401.604.401.959v0a.64.64 0 01-.657.643 4.857 4.857 0 00-4.146-2.97c-1.921-.168-3.244 2.105-2.387 4.124l.101.245a.64.64 0 01-.657.643 4.857 4.857 0 00-2.97 4.146c-.168 1.92 2.105 3.244 4.124 2.387l.245-.101a.64.64 0 01.643.657 4.857 4.857 0 004.146 2.97c1.921.168 3.244-2.105 2.387-4.124l-.101-.245a.64.64 0 01.657-.643v0c.355 0 .676-.186.959-.401.29-.221.634-.349 1.003-.349 1.035 0 1.875 1.007 1.875 2.25s-.84 2.25-1.875 2.25c-.369 0-.713-.128-1.003-.349-.283-.215-.604-.401-.959-.401v0c-.31 0-.555-.26-.555-.584V6.67c0-.324.245-.584.555-.584z" /></svg>
                            </div>
                            <h2 class="text-3xl font-bold">Tampermonkey</h2>
                        </div>
                        <p class="text-gray-400 mb-8 leading-relaxed" x-html="lang === 'fr' ? 'Le moteur de script indispensable. Installez l\'extension et activez l\'option <span class=\'text-primary\'>Accès aux URL de fichier</span>.' : 'The essential script engine. Install the extension and enable <span class=\'text-primary\'>Allow access to file URLs</span>.'"></p>
                        
                        <a href="https://www.tampermonkey.net/" target="_blank" class="inline-flex h-12 items-center justify-center rounded-xl border border-white/10 bg-white/5 px-8 text-sm font-medium transition-colors hover:bg-white/10 hover:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-gray-900">
                            Download Extension
                        </a>
                    </div>
                    <div class="w-full md:w-2/3 perspective-container">
                        <div class="window-3d cursor-zoom-in" @click="modalOpen = true; modalImage = 'img/step1-tampermonkey.png'">
                            <div class="mac-header">
                                <div class="dot dot-red"></div>
                                <div class="dot dot-yellow"></div>
                                <div class="dot dot-green"></div>
                                <div class="ml-auto text-[10px] text-gray-600 font-mono">Step 1</div>
                            </div>
                            <img src="img/step1-tampermonkey.png" class="w-full opacity-90" alt="Tampermonkey">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 2: Script (Blue Card) -->
            <div class="premium-card p-8 md:p-12 reveal group border-accent/20">
                <!-- Glows -->
                <div class="glow-blue -right-20 -top-20 opacity-40"></div>

                <div class="relative z-10 flex flex-col md:flex-row-reverse items-center gap-12">
                    <div class="w-full md:w-1/2">
                        <div class="flex items-center gap-4 mb-6 md:flex-row-reverse">
                            <div class="icon-container icon-blue">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 18" /></svg>
                            </div>
                            <h2 class="text-3xl font-bold text-gradient-blue" x-text="lang === 'fr' ? 'Le Script' : 'The Script'"></h2>
                        </div>
                        <p class="text-gray-400 mb-8 leading-relaxed text-left md:text-right" x-text="lang === 'fr' ? 'Le cœur du système. Ce script sécurisé va scanner vos conversations pour créer l\'archive.' : 'The heart of the system. This secure script will scan your conversations to create the archive.'"></p>
                        
                        <div class="flex justify-start md:justify-end">
                            <a href="https://greasyfork.org/fr/scripts/456055-chatgpt-exporter" target="_blank" class="inline-flex h-12 items-center justify-center rounded-xl bg-accent px-8 text-sm font-bold text-black transition-all hover:scale-105 hover:shadow-[0_0_30px_rgba(6,182,212,0.4)]">
                                <span x-text="lang === 'fr' ? 'Installer le Script' : 'Install Script'"></span>
                            </a>
                        </div>
                    </div>

                    <div class="w-full md:w-1/2 flex justify-center">
                        <!-- Code Block Viz -->
                        <div class="w-full max-w-sm bg-[#05070a] rounded-xl border border-accent/20 p-6 relative overflow-hidden group-hover:border-accent/40 transition-colors">
                            <div class="absolute inset-0 bg-accent/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <div class="flex gap-2 mb-4">
                                <div class="w-2 h-2 rounded-full bg-accent/50"></div>
                                <div class="w-2 h-2 rounded-full bg-accent/30"></div>
                            </div>
                            <div class="space-y-2 font-mono text-xs text-accent/70">
                                <div class="w-3/4 h-2 bg-accent/20 rounded"></div>
                                <div class="w-1/2 h-2 bg-accent/20 rounded"></div>
                                <div class="w-5/6 h-2 bg-accent/10 rounded"></div>
                            </div>
                            <div class="mt-8 text-center">
                                <span class="text-accent text-sm font-bold tracking-widest">ACTIVE</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 3: Export (Orange/Primary Focus) -->
            <div class="premium-card p-8 md:p-12 reveal group">
                <div class="glow-orange -left-20 -bottom-20 opacity-30"></div>

                <div class="relative z-10 flex flex-col md:flex-row items-center gap-12">
                    <div class="w-full md:w-1/3">
                        <div class="flex items-center gap-4 mb-6">
                            <div class="icon-container icon-orange">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 01-.825-.242m9.345-8.334a2.126 2.126 0 00-.476-.095 48.64 48.64 0 00-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0011.25 3c-2.115 0-4.198.137-6.197.388-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155" /></svg>
                            </div>
                            <h2 class="text-3xl font-bold">Export Button</h2>
                        </div>
                        <p class="text-gray-400 mb-8 leading-relaxed" x-text="lang === 'fr' ? 'Retournez sur ChatGPT. Un bouton magique est apparu.' : 'Return to ChatGPT. A magic button has appeared.'"></p>
                    </div>
                    
                    <div class="w-full md:w-2/3">
                        <div class="window-3d cursor-zoom-in border-primary/20" @click="modalOpen = true; modalImage = 'img/step3-export-button.png'">
                            <div class="mac-header">
                                <div class="dot dot-red"></div>
                                <div class="dot dot-yellow"></div>
                                <div class="dot dot-green"></div>
                                <div class="ml-auto text-[10px] text-gray-600 font-mono">Step 3</div>
                            </div>
                            <img src="img/step3-export-button.png" class="w-full opacity-90" alt="Step 3">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Final Steps Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 reveal">
                
                <!-- Step 4 -->
                <div class="premium-card p-8 group cursor-pointer" @click="modalOpen = true; modalImage = 'img/step4-select-all.png'">
                    <div class="flex justify-between items-start mb-6">
                        <div class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center font-serif text-xl text-gray-400 group-hover:text-white group-hover:bg-white/10 transition-all">4</div>
                        <span class="text-xs font-mono text-gray-600">SELECT</span>
                    </div>
                    <h3 class="text-2xl font-bold mb-4">Selection</h3>
                    <p class="text-sm text-gray-400 mb-6" x-text="lang === 'fr' ? 'Tout Exporter > Tout Sélectionner.' : 'Export All > Select All.'"></p>
                    <div class="rounded-lg border border-white/5 overflow-hidden">
                        <img src="img/step4-select-all.png" class="w-full hover:scale-110 transition-transform duration-500" alt="Step 4">
                    </div>
                </div>

                <!-- Step 5 -->
                <div class="premium-card p-8 group cursor-pointer border-primary/30" @click="modalOpen = true; modalImage = 'img/step5-export.png'">
                    <div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="flex justify-between items-start mb-6 relative z-10">
                        <div class="w-10 h-10 rounded-full bg-primary/20 border border-primary/40 flex items-center justify-center font-serif text-xl text-primary group-hover:scale-110 transition-transform">5</div>
                        <span class="text-xs font-mono text-primary/60">DOWNLOAD</span>
                    </div>
                    <h3 class="text-2xl font-bold mb-4 relative z-10">Download ZIP</h3>
                    <p class="text-sm text-gray-400 mb-6 relative z-10" x-text="lang === 'fr' ? 'Validez pour obtenir votre ZIP.' : 'Confirm to get your ZIP.'"></p>
                    <div class="rounded-lg border border-primary/20 overflow-hidden relative z-10">
                        <img src="img/step5-export.png" class="w-full hover:scale-110 transition-transform duration-500" alt="Step 5">
                    </div>
                </div>

            </div>

            <!-- Success Footer -->
            <div class="text-center relative py-20 reveal">
                <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-primary/20 blur-[100px] rounded-full pointer-events-none"></div>
                
                <div class="relative z-10">
                    <div class="inline-flex p-4 rounded-full bg-gradient-to-br from-green-500/20 to-transparent border border-green-500/30 mb-8 shadow-[0_0_40px_rgba(34,197,94,0.2)]">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
                    </div>
                    <h2 class="text-4xl md:text-5xl font-serif italic mb-6" x-text="lang === 'fr' ? 'Tout est prêt.' : 'You are all set.'"></h2>
                    <p class="text-gray-400 max-w-lg mx-auto" x-text="lang === 'fr' ? 'Gardez le fichier ZIP. Il est la clé de votre futur espace.' : 'Keep the ZIP file. It is the key to your future workspace.'"></p>
                </div>
            </div>

        </div>

        <!-- Footer -->
        <div class="text-center mt-20 border-t border-white/5 pt-10">
            <p class="text-gray-600 text-[10px] uppercase tracking-widest">© 2025 GPT Pro. Designed for Founders.</p>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div x-show="modalOpen" 
         style="display: none;"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-xl p-4"
         @click="modalOpen = false"
         @keydown.escape.window="modalOpen = false">
        
        <div class="relative w-full max-w-7xl flex items-center justify-center h-full" @click.stop>
            <button @click="modalOpen = false" class="absolute top-4 right-4 text-white bg-white/10 hover:bg-primary hover:text-black px-6 py-2 rounded-full border border-white/10 transition-all z-50">
                <span class="text-xs font-bold uppercase tracking-widest">Close</span>
            </button>
            <div class="mac-window w-full max-h-[90vh] flex flex-col shadow-2xl border border-white/10 rounded-xl overflow-hidden">
                <div class="mac-header shrink-0 bg-[#1a1a1a]">
                    <div class="dot dot-red"></div>
                    <div class="dot dot-yellow"></div>
                    <div class="dot dot-green"></div>
                </div>
                <div class="overflow-auto bg-[#0f0f0f] flex items-center justify-center flex-1 p-2 md:p-8">
                    <img :src="modalImage" class="max-w-full max-h-full object-contain rounded-lg shadow-lg" alt="Full size">
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Scroll Reveal
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        // Stars Background (Preserved)
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height, stars = [];
        
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.x = Math.random() * width; this.y = Math.random() * height;
                this.size = Math.random() * 1.2; this.speed = Math.random() * 0.2 + 0.05;
                this.opacity = Math.random();
            }
            update() {
                this.y -= this.speed; if (this.y < 0) this.y = height;
                this.opacity += (Math.random() - 0.5) * 0.05;
                if (this.opacity < 0) this.opacity = 0; if (this.opacity > 1) this.opacity = 1;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.4})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        for(let i=0; i<80; i++) stars.push(new Star());
        function animate() { ctx.clearRect(0, 0, width, height); stars.forEach(s => { s.update(); s.draw(); }); requestAnimationFrame(animate); }
        animate();
    </script>
</body>
</html>
